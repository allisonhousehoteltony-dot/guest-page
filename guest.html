<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Guest Service</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f9fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.08);text-align:center}
h1{font-size:1.4rem;margin-bottom:4px}
.loc{color:#4a7c59;font-weight:600;margin:8px 0 24px}
label{display:block;text-align:left;font-size:.8rem;font-weight:600;color:#666;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input[type="text"]{width:100%;padding:14px 16px;font-size:1rem;border:1.5px solid #e0e0e0;border-radius:8px;outline:none}
input[type="text"]:focus{border-color:#4a7c59}
button{width:100%;margin-top:20px;padding:16px;font-size:1rem;font-weight:600;color:#fff;background:#4a7c59;border:none;border-radius:8px;cursor:pointer}
button:hover{background:#3d6b4a}
.notice{margin-top:20px;font-size:.75rem;color:#999;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>Welcome</h1>
<p>Enter your booking name to get your key info</p>
<p class="loc" id="pn"></p>
<form action="https://hook.eu1.make.com/3spxeu1h076utc9pk7yn32iqlnltiy8v" method="POST">
<input type="hidden" name="action" value="verify">
<input type="hidden" name="property" id="prop">
<div>
<label>Booking Name</label>
<input type="text" name="guest_name" placeholder="Your name as on the booking" required autocomplete="name">
</div>
<button type="submit">Find My Key</button>
</form>
<p class="notice">🔒 This is a secure service channel. We will never ask for payment or personal details here.</p>
</div>
<script>
const P=new URLSearchParams(location.search).get('p')||'';
const names={no1:'No 1',no2:'No 2',no4:'No 4','no5-2':'No 5/2',no6:'No 6',no7:'No 7',no7a:'No 7A',no9:'No 9',no11:'No 11',no12:'No 12',no14:'No 14',no16:'Allison House 16',no17:'Allison House 17','no17-1':'No 17/1',no19:'No 19',no22:'No 22',no23:'No 23',no25:'No 25',no28:'No 28',no31:'No 31',no41:'No 41',no52:'No 52',no66:'No 66',no73:'No 73',no86:'No 86',no91:'No 91'};
document.getElementById('pn').textContent='📍 '+(names[P]||P);
document.getElementById('prop').value=P;
</script>
</body>
</html>
